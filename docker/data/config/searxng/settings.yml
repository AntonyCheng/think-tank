use_default_settings:
  engines:
    keep_only:
      - 360search
      - quark
      - bing

general:
  instance_name: "Think Tank Search"

ui:
  default_locale: zh-Hans-CN

search:
  default_lang: zh-CN
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false

# 面向中国大陆部署：只保留在境内可直连的搜索引擎。
# Google / DuckDuckGo / Startpage / Brave 在境内不可用，一律不启用。
# baidu / sogou 对 SearXNG 请求会返回验证码，已剔除；bing 保留（HTML 解析偶发失败）。
# 360search 最稳定，quark 次之；高并发（深度研究）下仍可能被限流。
engines:
  - name: 360search
    disabled: false
    timeout: 15.0
  - name: quark
    disabled: false
    timeout: 15.0
  - name: bing
    disabled: false
    base_url: https://cn.bing.com
