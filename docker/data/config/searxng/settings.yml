use_default_settings:
  engines:
    keep_only:
      - bing

general:
  instance_name: "Think Tank Search"

ui:
  default_locale: zh-Hans-CN

search:
  default_lang: zh-CN
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false

engines:
  - name: bing
    disabled: false
    base_url: https://www.bing.com
