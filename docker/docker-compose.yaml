name: thinktank

services:
  thinktank-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    image: thinktank-web:local
    container_name: thinktank-web
    init: true
    restart: unless-stopped
    depends_on:
      thinktank-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-7168}:80"
    networks:
      - thinktank_network

  thinktank-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    image: thinktank-api:local
    container_name: thinktank-api
    init: true
    restart: unless-stopped
    depends_on:
      thinktank-researcher:
        condition: service_healthy
      thinktank-postgres:
        condition: service_healthy
    env_file:
      - ./data/config/runtime/runtime.env
      - ./data/config/api/api.env
      - ./data/config/postgres/postgres.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      GPTR_SERVICE_URL: http://thinktank-researcher:8010
      LOCAL_DOCUMENTS_ROOT: /app/.think-tank/documents
      RUNTIME_ENV_FILE: /app/config/runtime.env
      WEB_ROOT: /app/empty-web
    command:
      - sh
      - -c
      - export DATABASE_URL="postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@thinktank-postgres:5432/$${POSTGRES_DB}"; exec node apps/orchestrator/dist/src/api-server.js
    expose:
      - "3000"
    volumes:
      - ./data/app:/app/.think-tank
      - ./data/config/runtime:/app/config
    networks:
      - thinktank_network

  thinktank-postgres:
    image: postgres:17.6-bookworm
    container_name: thinktank-postgres
    init: true
    restart: unless-stopped
    env_file:
      - ./data/config/postgres/postgres.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - thinktank_network

  thinktank-researcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.researcher
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    image: thinktank-researcher:local
    container_name: thinktank-researcher
    init: true
    restart: unless-stopped
    depends_on:
      thinktank-searxng:
        condition: service_healthy
      thinktank-ocr:
        condition: service_started
    env_file:
      - ./data/config/runtime/runtime.env
    environment:
      LOCAL_DOCUMENTS_ROOT: /app/.think-tank/documents
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      OCR_SERVICE_URL: http://thinktank-ocr:8020
    expose:
      - "8010"
    volumes:
      - ./data/app/documents:/app/.think-tank/documents:ro
      - ./data/researcher/exports:/app/.think-tank/exports
    networks:
      - thinktank_network

  thinktank-ocr:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ocr
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    image: thinktank-ocr:local
    container_name: thinktank-ocr
    init: true
    restart: unless-stopped
    environment:
      OCR_WARMUP: ${OCR_WARMUP:-true}
    expose:
      - "8020"
    volumes:
      - ./data/ocr-models:/app/.ocr-models
    networks:
      - thinktank_network

  thinktank-searxng:
    image: docker.io/searxng/searxng:2026.8.14-094c33d40
    container_name: thinktank-searxng
    init: true
    restart: unless-stopped
    env_file:
      - ./data/config/searxng/searxng.env
    environment:
      FORCE_OWNERSHIP: "false"
      SEARXNG_BASE_URL: http://thinktank-searxng:8080/
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_IMAGE_PROXY: "false"
    expose:
      - "8080"
    ports:
      - "${SEARXNG_PUBLIC_PORT:-7170}:8080"
    volumes:
      - ./data/config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./data/searxng/cache:/var/cache/searxng
    healthcheck:
      test:
        - CMD
        - /usr/local/searxng/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - thinktank_network

  thinktank-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    image: thinktank-mcp:local
    container_name: thinktank-mcp
    init: true
    restart: unless-stopped
    depends_on:
      thinktank-api:
        condition: service_healthy
    env_file:
      - ./data/config/mcp/mcp.env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "7010"
      THINK_TANK_API_URL: http://thinktank-api:3000
    ports:
      - "${MCP_PUBLIC_PORT:-7169}:7010"
    volumes:
      - ./data/mcp/artifacts:/app/mcp-server/artifacts
    networks:
      - thinktank_network

networks:
  thinktank_network:
    name: thinktank_network
    driver: bridge
